{% extends 'base.html' %}
{% load static %}

{% block title %}Lanzador de Dados - RPG Platform{% endblock %}

{% block content %}
<div class="container py-5">
    <!-- Header -->
    <div class="text-center mb-5">
        <h1 class="display-4 mb-2">
            <i class="fas fa-dice"></i> DICE ROLLER
        </h1>
        <p class="lead text-muted">Elige tu dado y lanza los dados del destino</p>
    </div>

    <div class="row">
        <!-- Selector de dados -->
        <div class="col-lg-8 mx-auto">
            <!-- Grid de dados -->
            <div class="row g-3 mb-5">
                <div class="col-6 col-sm-4 col-md-3">
                    <button class="btn btn-dice w-100 h-100 dice-btn" data-dice="d4">
                        <div class="dice-icon">△</div>
                        <div class="dice-label">D4</div>
                    </button>
                </div>
                <div class="col-6 col-sm-4 col-md-3">
                    <button class="btn btn-dice w-100 h-100 dice-btn" data-dice="d6">
                        <div class="dice-icon">⬜</div>
                        <div class="dice-label">D6</div>
                    </button>
                </div>
                <div class="col-6 col-sm-4 col-md-3">
                    <button class="btn btn-dice w-100 h-100 dice-btn" data-dice="d8">
                        <div class="dice-icon">◇</div>
                        <div class="dice-label">D8</div>
                    </button>
                </div>
                <div class="col-6 col-sm-4 col-md-3">
                    <button class="btn btn-dice w-100 h-100 dice-btn" data-dice="d10">
                        <div class="dice-icon">⬠</div>
                        <div class="dice-label">D10</div>
                    </button>
                </div>
                <div class="col-6 col-sm-4 col-md-3">
                    <button class="btn btn-dice w-100 h-100 dice-btn" data-dice="d12">
                        <div class="dice-icon">◈</div>
                        <div class="dice-label">D12</div>
                    </button>
                </div>
                <div class="col-6 col-sm-4 col-md-3">
                    <button class="btn btn-dice w-100 h-100 dice-btn" data-dice="d20">
                        <div class="dice-icon">⬢</div>
                        <div class="dice-label">D20</div>
                    </button>
                </div>
            </div>

            <!-- Cantidad de dados -->
            <div class="card border-secondary mb-4">
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col-md-6">
                            <label for="diceQuantity" class="form-label mb-0">Cantidad de dados:</label>
                        </div>
                        <div class="col-md-6">
                            <input type="number" id="diceQuantity" class="form-control form-control-lg text-center" 
                                   value="1" min="1" max="100">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Botón lanzar -->
            <div class="text-center mb-5">
                <button id="rollBtn" class="btn btn-primary btn-lg px-5 py-3" disabled>
                    <i class="fas fa-dice-d20"></i> LANZAR
                </button>
            </div>
        </div>
    </div>

    <!-- Resultado de la tirada -->
    <div id="resultContainer" class="d-none mt-5">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="card bg-dark border-primary shadow-lg">
                    <div class="card-body text-center py-5">
                        <!-- Dado seleccionado -->
                        <div class="mb-4">
                            <h2 id="selectedDice" class="text-primary mb-2">D20</h2>
                            <p class="text-muted">Tipo de dado</p>
                        </div>

                        <!-- Resultado animado -->
                        <div class="mb-4">
                            <h1 id="totalResult" class="display-2 text-success fw-bold result-animate">
                                20
                            </h1>
                            <p class="text-muted">Resultado total</p>
                        </div>

                        <!-- Detalles de tiradas individuales -->
                        <div id="individualResults" class="text-start bg-secondary bg-opacity-10 p-3 rounded mb-4">
                            <p class="text-muted mb-2">Detalles de las tiradas:</p>
                            <div id="resultsList" class="d-flex flex-wrap gap-2">
                            </div>
                        </div>

                        <!-- Botones de acción -->
                        <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                            <button id="saveRollBtn" class="btn btn-success btn-lg">
                                <i class="fas fa-save"></i> Guardar tirada
                            </button>
                            <button id="newRollBtn" class="btn btn-secondary btn-lg">
                                <i class="fas fa-redo"></i> Nueva tirada
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- CSS Personalizado -->
<style>
    /* Animación de dados */
    @keyframes rollDice {
        0% {
            transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg);
        }
        100% {
            transform: rotateX(720deg) rotateY(720deg) rotateZ(720deg);
        }
    }

    @keyframes popIn {
        0% {
            transform: scale(0);
            opacity: 0;
        }
        50% {
            transform: scale(1.1);
        }
        100% {
            transform: scale(1);
            opacity: 1;
        }
    }

    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes glow {
        0%, 100% {
            text-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }
        50% {
            text-shadow: 0 0 20px rgba(76, 175, 80, 1);
        }
    }

    /* Estilos de botones de dados */
    .btn-dice {
        border: 2px solid #30363d;
        background-color: #0d1117;
        color: #e0e0e0;
        padding: 20px 10px;
        border-radius: 8px;
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 120px;
    }

    .btn-dice:hover {
        border-color: #58a6ff;
        color: #58a6ff;
        transform: translateY(-5px);
        box-shadow: 0 0 20px rgba(88, 166, 255, 0.3);
    }

    .btn-dice.active {
        border-color: #238636;
        background-color: rgba(35, 134, 54, 0.2);
        color: #4ade80;
        box-shadow: 0 0 30px rgba(35, 134, 54, 0.5);
    }

    .dice-icon {
        font-size: 3rem;
        margin-bottom: 10px;
    }

    .dice-label {
        font-size: 1.2rem;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    /* Animación del resultado */
    .result-animate {
        animation: popIn 0.6s ease-out, glow 1.5s ease-in-out infinite;
    }

    .roll-badge {
        display: inline-block;
        padding: 8px 12px;
        background-color: #238636;
        border-radius: 5px;
        font-weight: bold;
        color: #fff;
        animation: popIn 0.3s ease-out;
    }

    /* Contenedor de resultados */
    #resultContainer {
        animation: slideUp 0.5s ease-out;
    }

    /* Botón lanzar */
    #rollBtn {
        transition: all 0.3s ease;
    }

    #rollBtn:not(:disabled):hover {
        transform: scale(1.05);
        box-shadow: 0 0 30px rgba(35, 134, 54, 0.5);
    }

    #rollBtn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    #rollBtn.rolling {
        animation: rollDice 0.8s ease-in-out;
        pointer-events: none;
    }

    /* Responsive */
    @media (max-width: 576px) {
        .display-2 {
            font-size: 3rem;
        }
        .dice-icon {
            font-size: 2rem;
        }
        .btn-dice {
            min-height: 100px;
            padding: 15px 8px;
        }
    }
</style>

<script>
    const diceTypes = {
        'd4': 4,
        'd6': 6,
        'd8': 8,
        'd10': 10,
        'd12': 12,
        'd20': 20
    };

    let selectedDice = null;
    let currentResult = null;

    // Seleccionar dado
    document.querySelectorAll('.dice-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            // Remover clase active de todos los botones
            document.querySelectorAll('.dice-btn').forEach(b => b.classList.remove('active'));
            // Agregar clase active al botón clickeado
            this.classList.add('active');
            selectedDice = this.dataset.dice;
            // Habilitar botón de lanzar
            document.getElementById('rollBtn').disabled = false;
        });
    });

    // Botón lanzar
    document.getElementById('rollBtn').addEventListener('click', function() {
        if (!selectedDice) return;
        
        // Agregar animación de roll
        this.classList.add('rolling');
        this.disabled = true;

        // Simular delay de animación
        setTimeout(() => {
            rollDice();
            this.classList.remove('rolling');
            this.disabled = false;
        }, 800);
    });

    // Función para lanzar dados
    function rollDice() {
        const quantity = parseInt(document.getElementById('diceQuantity').value);
        
        fetch("{% url 'tirada:roll_ajax' %}", {
            method: 'POST',
            headers: {
                'X-CSRFToken': getCookie('csrftoken'),
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: `dice_type=${selectedDice}&quantity=${quantity}`
        })
        .then(response => response.json())
        .then(data => {
            currentResult = data;
            displayResult(data);
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Error al lanzar los dados');
        });
    }

    // Mostrar resultado
    function displayResult(data) {
        document.getElementById('selectedDice').textContent = selectedDice.toUpperCase();
        document.getElementById('totalResult').textContent = data.total;
        
        // Mostrar resultados individuales
        let resultsList = document.getElementById('resultsList');
        resultsList.innerHTML = '';
        
        data.results.forEach((result, index) => {
            const badge = document.createElement('span');
            badge.className = 'roll-badge';
            badge.textContent = result;
            resultsList.appendChild(badge);
        });

        // Mostrar contenedor de resultado
        document.getElementById('resultContainer').classList.remove('d-none');
        
        // Scroll al resultado
        document.getElementById('resultContainer').scrollIntoView({ behavior: 'smooth' });
    }

    // Guardar tirada
    document.getElementById('saveRollBtn').addEventListener('click', function() {
        const quantity = parseInt(document.getElementById('diceQuantity').value);
        
        fetch("{% url 'tirada:roller' %}", {
            method: 'POST',
            headers: {
                'X-CSRFToken': getCookie('csrftoken'),
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: `dice_type=${selectedDice}&quantity=${quantity}`
        })
        .then(response => {
            if (response.ok) {
                alert('✓ Tirada guardada exitosamente');
                // Limpiar resultado
                document.getElementById('resultContainer').classList.add('d-none');
            }
        })
        .catch(error => console.error('Error:', error));
    });

    // Nueva tirada
    document.getElementById('newRollBtn').addEventListener('click', function() {
        document.getElementById('resultContainer').classList.add('d-none');
        document.querySelectorAll('.dice-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('diceQuantity').value = 1;
        document.getElementById('rollBtn').disabled = true;
        selectedDice = null;
        currentResult = null;
    });

    // CSRF token helper
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
</script>
{% endblock %}
